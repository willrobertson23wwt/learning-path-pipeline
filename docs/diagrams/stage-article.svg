<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1176" viewBox="0 0 680 588" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="680" height="588" fill="#FFFFFF"/><text x="40" y="34" font-size="18" font-weight="600" fill="#2C2C2A">/article: the written version of a video</text><text x="40" y="54" font-size="12" fill="#5F5E5A">Usually started by /video in the background; run it alone to write or redo one.</text><g transform="translate(0 40)"><rect x="40" y="40" width="260" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="170.0" y="63" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">Check the inputs</text><text x="170.0" y="83" text-anchor="middle" font-size="12" fill="#5F5E5A">Scripts, the outline description</text><line x1="170.0" y1="98" x2="170.0" y2="119" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><rect x="40" y="122" width="260" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="170.0" y="145" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">Description lines</text><text x="170.0" y="165" text-anchor="middle" font-size="12" fill="#5F5E5A">Writes any that are missing</text><line x1="170.0" y1="180" x2="170.0" y2="201" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><rect x="40" y="204" width="260" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="170.0" y="227" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">Write the articles</text><text x="170.0" y="247" text-anchor="middle" font-size="12" fill="#5F5E5A">From the reviewed scripts</text><rect x="360" y="204" width="280" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="500.0" y="227" text-anchor="middle" font-size="14" font-weight="600" fill="#26215C">article-writer</text><text x="500.0" y="247" text-anchor="middle" font-size="12" fill="#534AB7">One per video, in parallel</text><path d="M302 232 L357 232" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><line x1="170.0" y1="262" x2="170.0" y2="283" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><rect x="40" y="286" width="260" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="170.0" y="309" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">Independent check</text><text x="170.0" y="329" text-anchor="middle" font-size="12" fill="#5F5E5A">Against unslop and house style</text><rect x="360" y="286" width="280" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1" stroke-dasharray="5 4"/><text x="500.0" y="309" text-anchor="middle" font-size="14" font-weight="600" fill="#04342C">prose-checker</text><text x="500.0" y="329" text-anchor="middle" font-size="12" fill="#0F6E56">Only if you wrote the article</text><path d="M302 314 L357 314" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)" stroke-dasharray="4 3"/><line x1="170.0" y1="344" x2="170.0" y2="365" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><rect x="40" y="368" width="260" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/><text x="170.0" y="391" text-anchor="middle" font-size="14" font-weight="600" fill="#412402">You review the articles</text><text x="170.0" y="411" text-anchor="middle" font-size="12" fill="#854F0B">Paths, word counts, gaps</text><rect x="40" y="458" width="14" height="14" rx="3" fill="#F1EFE8" stroke="#5F5E5A"/><text x="62" y="470" font-size="12" fill="#444441">main chat</text><rect x="150" y="458" width="14" height="14" rx="3" fill="#FAEEDA" stroke="#854F0B"/><text x="172" y="470" font-size="12" fill="#444441">your stop</text><rect x="260" y="458" width="14" height="14" rx="3" fill="#EEEDFE" stroke="#534AB7"/><text x="282" y="470" font-size="12" fill="#444441">agent, writes files</text><rect x="430" y="458" width="14" height="14" rx="3" fill="#E1F5EE" stroke="#0F6E56"/><text x="452" y="470" font-size="12" fill="#444441">reviewer, read-only</text><text x="40" y="498" font-size="12" fill="#5F5E5A">Lab-first: standalone videos only (the briefing, or items marked standalone).</text><text x="40" y="518" font-size="12" fill="#5F5E5A">Dashed: only when needed (the main chat decides, or the condition in the box holds).</text></g></svg>