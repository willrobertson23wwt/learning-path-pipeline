<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1584" viewBox="0 0 680 792" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="680" height="792" fill="#FFFFFF"/><text x="40" y="34" font-size="18" font-weight="600" fill="#2C2C2A">/lab: draft a lab guide</text><text x="40" y="54" font-size="12" fill="#5F5E5A">A WWT lab repo draft in labs/&lt;lab-slug&gt;/, from the outline, scripts and research.</text><g transform="translate(0 40)"><rect x="40" y="40" width="260" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="170.0" y="63" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">Read the inputs</text><text x="170.0" y="83" text-anchor="middle" font-size="12" fill="#5F5E5A">Outline, scripts, articles</text><line x1="170.0" y1="98" x2="170.0" y2="119" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><rect x="40" y="122" width="260" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="170.0" y="145" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">Research brief</text><text x="170.0" y="165" text-anchor="middle" font-size="12" fill="#5F5E5A">If missing or out of date</text><rect x="360" y="122" width="280" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="500.0" y="145" text-anchor="middle" font-size="14" font-weight="600" fill="#26215C">researcher</text><text x="500.0" y="165" text-anchor="middle" font-size="12" fill="#534AB7">Lab or module mode</text><path d="M302 150 L357 150" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><line x1="170.0" y1="180" x2="170.0" y2="201" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><rect x="40" y="204" width="260" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1" stroke-dasharray="5 4"/><text x="170.0" y="227" text-anchor="middle" font-size="14" font-weight="600" fill="#412402">Module split</text><text x="170.0" y="247" text-anchor="middle" font-size="12" fill="#854F0B">Only if the outline has none</text><line x1="170.0" y1="262" x2="170.0" y2="283" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><rect x="40" y="286" width="260" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="170.0" y="309" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">Write learner pages</text><text x="170.0" y="329" text-anchor="middle" font-size="12" fill="#5F5E5A">Index, environment, modules</text><line x1="170.0" y1="344" x2="170.0" y2="365" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><rect x="40" y="368" width="260" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="170.0" y="391" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">Write internal files</text><text x="170.0" y="411" text-anchor="middle" font-size="12" fill="#5F5E5A">SETUP, SUPPORT, LISTING, shots</text><line x1="170.0" y1="426" x2="170.0" y2="447" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><rect x="40" y="450" width="260" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="170.0" y="473" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">Unslop and checks</text><text x="170.0" y="493" text-anchor="middle" font-size="12" fill="#5F5E5A">Dryrun states checked</text><line x1="170.0" y1="508" x2="170.0" y2="529" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><rect x="40" y="532" width="260" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/><text x="170.0" y="555" text-anchor="middle" font-size="14" font-weight="600" fill="#412402">You review the draft</text><text x="170.0" y="575" text-anchor="middle" font-size="12" fill="#854F0B">Then /lab-review</text><rect x="40" y="622" width="14" height="14" rx="3" fill="#F1EFE8" stroke="#5F5E5A"/><text x="62" y="634" font-size="12" fill="#444441">main chat</text><rect x="150" y="622" width="14" height="14" rx="3" fill="#FAEEDA" stroke="#854F0B"/><text x="172" y="634" font-size="12" fill="#444441">your stop</text><rect x="260" y="622" width="14" height="14" rx="3" fill="#EEEDFE" stroke="#534AB7"/><text x="282" y="634" font-size="12" fill="#444441">agent, writes files</text><rect x="430" y="622" width="14" height="14" rx="3" fill="#E1F5EE" stroke="#0F6E56"/><text x="452" y="634" font-size="12" fill="#444441">reviewer, read-only</text><text x="40" y="662" font-size="12" fill="#5F5E5A">Traditional: one fully guided lab per module.</text><text x="40" y="682" font-size="12" fill="#5F5E5A">Lab-first: guidance levels and embedded media. /lab &lt;slug&gt; capstone adds a Solutions page,</text><text x="40" y="702" font-size="12" fill="#5F5E5A">and /lab &lt;slug&gt; 0 writes the path page instead of a lab.</text><text x="40" y="722" font-size="12" fill="#5F5E5A">Dashed: only when needed (the main chat decides, or the condition in the box holds).</text></g></svg>