<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1432" viewBox="0 0 680 716" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="680" height="716" fill="#FFFFFF"/><text x="40" y="34" font-size="18" font-weight="600" fill="#2C2C2A">The video section: skills and where they fit</text><text x="40" y="54" font-size="12" fill="#5F5E5A">Stage skills run in order and wait for you; helpers sit beside the stage that uses them.</text><g transform="translate(0 40)"><rect x="40" y="40" width="260" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="170.0" y="63" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">/outline</text><text x="170.0" y="83" text-anchor="middle" font-size="12" fill="#5F5E5A">Videos, chapters, visual moments</text><line x1="170.0" y1="98" x2="170.0" y2="119" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><rect x="40" y="122" width="260" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="170.0" y="145" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">/scripts</text><text x="170.0" y="165" text-anchor="middle" font-size="12" fill="#5F5E5A">Narration and visual brief</text><rect x="360" y="122" width="280" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="500.0" y="145" text-anchor="middle" font-size="14" font-weight="600" fill="#4A1B0C">/unslop</text><text x="500.0" y="165" text-anchor="middle" font-size="12" fill="#993C1D">Cuts AI tells before saving</text><path d="M302 150 L357 150" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><line x1="170.0" y1="180" x2="170.0" y2="201" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><rect x="40" y="204" width="260" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="170.0" y="227" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">/audio</text><text x="170.0" y="247" text-anchor="middle" font-size="12" fill="#5F5E5A">Narration, timings, captions</text><rect x="360" y="204" width="280" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1" stroke-dasharray="5 4"/><text x="500.0" y="227" text-anchor="middle" font-size="14" font-weight="600" fill="#4A1B0C">/produce</text><text x="500.0" y="247" text-anchor="middle" font-size="12" fill="#993C1D">/audio then /video, no listen stop</text><path d="M302 232 L357 232" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)" stroke-dasharray="4 3"/><line x1="170.0" y1="262" x2="170.0" y2="283" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><rect x="40" y="286" width="260" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/><text x="170.0" y="309" text-anchor="middle" font-size="14" font-weight="600" fill="#412402">You listen to the takes</text><text x="170.0" y="329" text-anchor="middle" font-size="12" fill="#854F0B">Retakes go back to /audio</text><line x1="170.0" y1="344" x2="170.0" y2="398.0" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><rect x="40" y="401.0" width="260" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="170.0" y="424.0" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">/video</text><text x="170.0" y="444.0" text-anchor="middle" font-size="12" fill="#5F5E5A">Design, build, mix, render</text><rect x="360" y="368" width="280" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="500.0" y="391" text-anchor="middle" font-size="14" font-weight="600" fill="#4A1B0C">/article</text><text x="500.0" y="411" text-anchor="middle" font-size="12" fill="#993C1D">Written version, in background</text><path d="M302 429.0 L330 429.0 L330 396 L357 396" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><rect x="360" y="434" width="280" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="500.0" y="457" text-anchor="middle" font-size="14" font-weight="600" fill="#4A1B0C">/revise</text><text x="500.0" y="477" text-anchor="middle" font-size="12" fill="#993C1D">Fixes notes marked in the editor</text><path d="M302 429.0 L330 429.0 L330 462 L357 462" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><line x1="170.0" y1="459.0" x2="170.0" y2="513" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><rect x="40" y="516" width="260" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="170.0" y="539" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">/closeout</text><text x="170.0" y="559" text-anchor="middle" font-size="12" fill="#5F5E5A">Zips deliverables, frees disk</text><rect x="360" y="516" width="280" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="500.0" y="539" text-anchor="middle" font-size="14" font-weight="600" fill="#4A1B0C">/toolkit-review</text><text x="500.0" y="559" text-anchor="middle" font-size="12" fill="#993C1D">Moves shared code to lp-toolkit</text><path d="M302 544 L357 544" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><rect x="40" y="606" width="14" height="14" rx="3" fill="#F1EFE8" stroke="#5F5E5A"/><text x="62" y="618" font-size="12" fill="#444441">stage skill</text><rect x="160" y="606" width="14" height="14" rx="3" fill="#FAEEDA" stroke="#854F0B"/><text x="182" y="618" font-size="12" fill="#444441">your check</text><rect x="280" y="606" width="14" height="14" rx="3" fill="#FAECE7" stroke="#993C1D"/><text x="302" y="618" font-size="12" fill="#444441">helper skill</text><text x="40" y="646" font-size="12" fill="#5F5E5A">Dashed: a shortcut you run by request.</text></g></svg>