<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1052" viewBox="0 0 680 526" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="680" height="526" fill="#FFFFFF"/><text x="40" y="34" font-size="18" font-weight="600" fill="#2C2C2A">/audio: narration, timings and captions</text><text x="40" y="54" font-size="12" fill="#5F5E5A">Spends ElevenLabs credits, so it runs only when you ask for it.</text><g transform="translate(0 40)"><rect x="40" y="40" width="260" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="170.0" y="63" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">Dry run</text><text x="170.0" y="83" text-anchor="middle" font-size="12" fill="#5F5E5A">Character counts, the plan</text><rect x="360" y="40" width="280" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="500.0" y="63" text-anchor="middle" font-size="14" font-weight="600" fill="#04342C">script-linter</text><text x="500.0" y="83" text-anchor="middle" font-size="12" fill="#0F6E56">Lints in parallel; blocking stops it</text><path d="M302 68 L357 68" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><line x1="170.0" y1="98" x2="170.0" y2="119" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><rect x="40" y="122" width="260" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="170.0" y="145" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">Generate narration</text><text x="170.0" y="165" text-anchor="middle" font-size="12" fill="#5F5E5A">npx lp-generate-audio</text><rect x="360" y="122" width="280" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/><text x="500.0" y="145" text-anchor="middle" font-size="14" font-weight="600" fill="#042C53">ElevenLabs</text><text x="500.0" y="165" text-anchor="middle" font-size="12" fill="#185FA5">Skips takes that already exist</text><path d="M302 150 L357 150" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><line x1="170.0" y1="180" x2="170.0" y2="201" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><rect x="40" y="204" width="260" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="170.0" y="227" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">Transcribe and caption</text><text x="170.0" y="247" text-anchor="middle" font-size="12" fill="#5F5E5A">lp-transcribe, lp-captions</text><line x1="170.0" y1="262" x2="170.0" y2="283" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><rect x="40" y="286" width="260" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/><text x="170.0" y="309" text-anchor="middle" font-size="14" font-weight="600" fill="#412402">You listen to every take</text><text x="170.0" y="329" text-anchor="middle" font-size="12" fill="#854F0B">Retakes: fix the script, rerun</text><rect x="40" y="376" width="14" height="14" rx="3" fill="#F1EFE8" stroke="#5F5E5A"/><text x="62" y="388" font-size="12" fill="#444441">main chat</text><rect x="150" y="376" width="14" height="14" rx="3" fill="#FAEEDA" stroke="#854F0B"/><text x="172" y="388" font-size="12" fill="#444441">your stop</text><rect x="260" y="376" width="14" height="14" rx="3" fill="#EEEDFE" stroke="#534AB7"/><text x="282" y="388" font-size="12" fill="#444441">agent</text><rect x="350" y="376" width="14" height="14" rx="3" fill="#E1F5EE" stroke="#0F6E56"/><text x="372" y="388" font-size="12" fill="#444441">reviewer</text><rect x="460" y="376" width="14" height="14" rx="3" fill="#E6F1FB" stroke="#185FA5"/><text x="482" y="388" font-size="12" fill="#444441">outside tool</text><text x="40" y="416" font-size="12" fill="#5F5E5A">Traditional: every chapter and chapter 0; regenerate at most once per video, after the shot list.</text><text x="40" y="436" font-size="12" fill="#5F5E5A">Lab-first: videos and the briefing only. GIFs and cards are silent.</text><text x="40" y="456" font-size="12" fill="#5F5E5A">/produce runs /audio then /video and skips only this listen stop.</text></g></svg>