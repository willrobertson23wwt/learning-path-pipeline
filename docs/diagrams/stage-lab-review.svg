<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1472" viewBox="0 0 680 736" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="680" height="736" fill="#FFFFFF"/><text x="40" y="34" font-size="18" font-weight="600" fill="#2C2C2A">/lab-review and /lab-topology</text><text x="40" y="54" font-size="12" fill="#5F5E5A">A documentation-only review before any VM exists, then the environment diagram.</text><g transform="translate(0 40)"><rect x="40" y="40" width="260" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="170.0" y="63" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">Walk the lab</text><text x="170.0" y="83" text-anchor="middle" font-size="12" fill="#5F5E5A">Commands, house rules, unslop</text><rect x="360" y="40" width="280" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1" stroke-dasharray="5 4"/><text x="500.0" y="63" text-anchor="middle" font-size="14" font-weight="600" fill="#26215C">lab-walker</text><text x="500.0" y="83" text-anchor="middle" font-size="12" fill="#534AB7">If /lab ran in this chat</text><path d="M302 68 L357 68" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)" stroke-dasharray="4 3"/><line x1="170.0" y1="98" x2="170.0" y2="152.0" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><rect x="40" y="155.0" width="260" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="170.0" y="178.0" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">Fresh-eyes reviews</text><text x="170.0" y="198.0" text-anchor="middle" font-size="12" fill="#5F5E5A">Launched together, read-only</text><rect x="360" y="122" width="280" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="500.0" y="145" text-anchor="middle" font-size="14" font-weight="600" fill="#04342C">lab-learner</text><text x="500.0" y="165" text-anchor="middle" font-size="12" fill="#0F6E56">Follows it as a learner would</text><path d="M302 183.0 L330 183.0 L330 150 L357 150" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><rect x="360" y="188" width="280" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="500.0" y="211" text-anchor="middle" font-size="14" font-weight="600" fill="#04342C">prose-checker</text><text x="500.0" y="231" text-anchor="middle" font-size="12" fill="#0F6E56">Rereads the learner pages</text><path d="M302 183.0 L330 183.0 L330 216 L357 216" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><line x1="170.0" y1="213.0" x2="170.0" y2="267" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><rect x="40" y="270" width="260" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="170.0" y="293" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">Triage and sync</text><text x="170.0" y="313" text-anchor="middle" font-size="12" fill="#5F5E5A">Apply fixes, sync the files</text><line x1="170.0" y1="328" x2="170.0" y2="349" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><rect x="40" y="352" width="260" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/><text x="170.0" y="375" text-anchor="middle" font-size="14" font-weight="600" fill="#412402">You review the report</text><text x="170.0" y="395" text-anchor="middle" font-size="12" fill="#854F0B">Design questions held for you</text><line x1="170.0" y1="410" x2="170.0" y2="431" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><rect x="40" y="434" width="260" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="170.0" y="457" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">/lab-topology</text><text x="170.0" y="477" text-anchor="middle" font-size="12" fill="#5F5E5A">Hand-drawn SVG of the devices</text><rect x="360" y="434" width="280" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/><text x="500.0" y="457" text-anchor="middle" font-size="14" font-weight="600" fill="#042C53">headless Chrome</text><text x="500.0" y="477" text-anchor="middle" font-size="12" fill="#185FA5">Renders and checks the SVG</text><path d="M302 462 L357 462" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><line x1="170.0" y1="492" x2="170.0" y2="513" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><rect x="40" y="516" width="260" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/><text x="170.0" y="539" text-anchor="middle" font-size="14" font-weight="600" fill="#412402">You approve the diagram</text><text x="170.0" y="559" text-anchor="middle" font-size="12" fill="#854F0B">Then its alt text goes in</text><rect x="40" y="606" width="14" height="14" rx="3" fill="#F1EFE8" stroke="#5F5E5A"/><text x="62" y="618" font-size="12" fill="#444441">main chat</text><rect x="150" y="606" width="14" height="14" rx="3" fill="#FAEEDA" stroke="#854F0B"/><text x="172" y="618" font-size="12" fill="#444441">your stop</text><rect x="260" y="606" width="14" height="14" rx="3" fill="#EEEDFE" stroke="#534AB7"/><text x="282" y="618" font-size="12" fill="#444441">agent</text><rect x="350" y="606" width="14" height="14" rx="3" fill="#E1F5EE" stroke="#0F6E56"/><text x="372" y="618" font-size="12" fill="#444441">reviewer</text><rect x="460" y="606" width="14" height="14" rx="3" fill="#E6F1FB" stroke="#185FA5"/><text x="482" y="618" font-size="12" fill="#444441">outside tool</text><text x="40" y="646" font-size="12" fill="#5F5E5A">No screenshots and no VM work at this stage.</text><text x="40" y="666" font-size="12" fill="#5F5E5A">Dashed: only when needed (the main chat decides, or the condition in the box holds).</text></g></svg>