<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1464" viewBox="0 0 680 732" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="680" height="732" fill="#FFFFFF"/><text x="40" y="34" font-size="18" font-weight="600" fill="#2C2C2A">/new-path: start a learning path</text><text x="40" y="54" font-size="12" fill="#5F5E5A">Run from the template, or from a new empty folder through the personal wrapper.</text><g transform="translate(0 40)"><rect x="40" y="40" width="260" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="170.0" y="63" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">Pick the target</text><text x="170.0" y="83" text-anchor="middle" font-size="12" fill="#5F5E5A">This empty folder, or a sibling</text><line x1="170.0" y1="98" x2="170.0" y2="119" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><rect x="40" y="122" width="260" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/><text x="170.0" y="145" text-anchor="middle" font-size="14" font-weight="600" fill="#412402">Traditional or lab-first?</text><text x="170.0" y="165" text-anchor="middle" font-size="12" fill="#854F0B">Asked unless you already said</text><line x1="170.0" y1="180" x2="170.0" y2="201" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><rect x="40" y="204" width="260" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="170.0" y="227" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">Copy, apply the format</text><text x="170.0" y="247" text-anchor="middle" font-size="12" fill="#5F5E5A">Template files, then apply-format</text><line x1="170.0" y1="262" x2="170.0" y2="283" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><rect x="40" y="286" width="260" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/><text x="170.0" y="309" text-anchor="middle" font-size="14" font-weight="600" fill="#412402">Platform details</text><text x="170.0" y="329" text-anchor="middle" font-size="12" fill="#854F0B">Shell, prompt, elevation, prefix</text><line x1="170.0" y1="344" x2="170.0" y2="365" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><rect x="40" y="368" width="260" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="170.0" y="391" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">Install and smoke test</text><text x="170.0" y="411" text-anchor="middle" font-size="12" fill="#5F5E5A">npm install, tsc, one still</text><rect x="360" y="368" width="280" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/><text x="500.0" y="391" text-anchor="middle" font-size="14" font-weight="600" fill="#042C53">lp-toolkit</text><text x="500.0" y="411" text-anchor="middle" font-size="12" fill="#185FA5">Fetched at the pinned tag</text><path d="M302 396 L357 396" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><line x1="170.0" y1="426" x2="170.0" y2="447" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><rect x="40" y="450" width="260" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="170.0" y="473" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">Memory notes, git init</text><text x="170.0" y="493" text-anchor="middle" font-size="12" fill="#5F5E5A">Notes copied, first commit</text><line x1="170.0" y1="508" x2="170.0" y2="529" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><rect x="40" y="532" width="260" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/><text x="170.0" y="555" text-anchor="middle" font-size="14" font-weight="600" fill="#412402">Open the new folder</text><text x="170.0" y="575" text-anchor="middle" font-size="12" fill="#854F0B">Then run /outline there</text><rect x="40" y="622" width="14" height="14" rx="3" fill="#F1EFE8" stroke="#5F5E5A"/><text x="62" y="634" font-size="12" fill="#444441">main chat</text><rect x="150" y="622" width="14" height="14" rx="3" fill="#FAEEDA" stroke="#854F0B"/><text x="172" y="634" font-size="12" fill="#444441">your stop</text><rect x="260" y="622" width="14" height="14" rx="3" fill="#E6F1FB" stroke="#185FA5"/><text x="282" y="634" font-size="12" fill="#444441">outside tool or repo</text><text x="40" y="662" font-size="12" fill="#5F5E5A">No agents. Nothing course-specific is ever written into the template itself.</text></g></svg>