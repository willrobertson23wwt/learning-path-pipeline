<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1956" viewBox="0 0 680 978" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="680" height="978" fill="#FFFFFF"/><text x="40" y="34" font-size="18" font-weight="600" fill="#2C2C2A">/lab-build and /lab-setup</text><text x="40" y="54" font-size="12" fill="#5F5E5A">From a reviewed guide to a golden vApp, then the dry run and screenshots.</text><g transform="translate(0 40)"><rect x="40" y="40" width="260" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="170.0" y="63" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">/lab-build: read the lab</text><text x="170.0" y="83" text-anchor="middle" font-size="12" fill="#5F5E5A">Environment page, SETUP.md</text><line x1="170.0" y1="98" x2="170.0" y2="119" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><rect x="40" y="122" width="260" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="170.0" y="145" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">Lay out the vApp</text><text x="170.0" y="165" text-anchor="middle" font-size="12" fill="#5F5E5A">Images, networks, firewall</text><rect x="360" y="122" width="280" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/><text x="500.0" y="145" text-anchor="middle" font-size="14" font-weight="600" fill="#042C53">Lab Builder</text><text x="500.0" y="165" text-anchor="middle" font-size="12" fill="#185FA5">lab.yaml, PLAN.md, catalog match</text><path d="M302 150 L357 150" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><line x1="170.0" y1="180" x2="170.0" y2="201" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><rect x="40" y="204" width="260" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="170.0" y="227" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">Plan the build</text><text x="170.0" y="247" text-anchor="middle" font-size="12" fill="#5F5E5A">Nothing to change or destroy</text><rect x="360" y="204" width="280" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/><text x="500.0" y="227" text-anchor="middle" font-size="14" font-weight="600" fill="#042C53">terraform</text><text x="500.0" y="247" text-anchor="middle" font-size="12" fill="#185FA5">Plan only, never applied</text><path d="M302 232 L357 232" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><line x1="170.0" y1="262" x2="170.0" y2="283" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><rect x="40" y="286" width="260" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/><text x="170.0" y="309" text-anchor="middle" font-size="14" font-weight="600" fill="#412402">You run the build</text><text x="170.0" y="329" text-anchor="middle" font-size="12" fill="#854F0B">And note the vApp address</text><line x1="170.0" y1="344" x2="170.0" y2="365" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><rect x="40" y="368" width="260" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="170.0" y="391" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">/lab-setup: audit</text><text x="170.0" y="411" text-anchor="middle" font-size="12" fill="#5F5E5A">Read-only, over SSH</text><rect x="360" y="368" width="280" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/><text x="500.0" y="391" text-anchor="middle" font-size="14" font-weight="600" fill="#042C53">the vApp</text><text x="500.0" y="411" text-anchor="middle" font-size="12" fill="#185FA5">lab-ssh and lab-scp</text><path d="M302 396 L357 396" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><line x1="170.0" y1="426" x2="170.0" y2="447" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><rect x="40" y="450" width="260" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/><text x="170.0" y="473" text-anchor="middle" font-size="14" font-weight="600" fill="#412402">You open egress</text><text x="170.0" y="493" text-anchor="middle" font-size="12" fill="#854F0B">Ports 80 and 443 at the edge</text><line x1="170.0" y1="508" x2="170.0" y2="529" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><rect x="40" y="532" width="260" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="170.0" y="555" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">Upgrade and set up</text><text x="170.0" y="575" text-anchor="middle" font-size="12" fill="#5F5E5A">setup.sh, hand-check, clean</text><line x1="170.0" y1="590" x2="170.0" y2="611" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><rect x="40" y="614" width="260" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="170.0" y="637" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">Record the build</text><text x="170.0" y="657" text-anchor="middle" font-size="12" fill="#5F5E5A">SETUP, SUPPORT, quickref IPs</text><line x1="170.0" y1="672" x2="170.0" y2="693" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><rect x="40" y="696" width="260" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/><text x="170.0" y="719" text-anchor="middle" font-size="14" font-weight="600" fill="#412402">You close egress, snapshot</text><text x="170.0" y="739" text-anchor="middle" font-size="12" fill="#854F0B">The golden image</text><line x1="170.0" y1="754" x2="170.0" y2="775" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><rect x="40" y="778" width="260" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/><text x="170.0" y="801" text-anchor="middle" font-size="14" font-weight="600" fill="#412402">Dry run and screenshots</text><text x="170.0" y="821" text-anchor="middle" font-size="12" fill="#854F0B">By hand: real output, PNGs</text><rect x="40" y="868" width="14" height="14" rx="3" fill="#F1EFE8" stroke="#5F5E5A"/><text x="62" y="880" font-size="12" fill="#444441">main chat</text><rect x="150" y="868" width="14" height="14" rx="3" fill="#FAEEDA" stroke="#854F0B"/><text x="172" y="880" font-size="12" fill="#444441">your stop</text><rect x="260" y="868" width="14" height="14" rx="3" fill="#E6F1FB" stroke="#185FA5"/><text x="282" y="880" font-size="12" fill="#444441">outside tool or system</text><text x="40" y="908" font-size="12" fill="#5F5E5A">Skip /lab-build when the ATC team delivers a stock vApp. No agents in either skill.</text></g></svg>