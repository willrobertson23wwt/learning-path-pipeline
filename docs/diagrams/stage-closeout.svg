<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1504" viewBox="0 0 680 752" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="680" height="752" fill="#FFFFFF"/><text x="40" y="34" font-size="18" font-weight="600" fill="#2C2C2A">/closeout and /toolkit-review</text><text x="40" y="54" font-size="12" fill="#5F5E5A">Archive a finished path, then share what it built through lp-toolkit.</text><g transform="translate(0 40)"><rect x="40" y="40" width="260" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="170.0" y="63" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">Preconditions</text><text x="170.0" y="83" text-anchor="middle" font-size="12" fill="#5F5E5A">Deliverables present, git clean</text><line x1="170.0" y1="98" x2="170.0" y2="119" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><rect x="40" y="122" width="260" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="170.0" y="145" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">Dry run, build the zip</text><text x="170.0" y="165" text-anchor="middle" font-size="12" fill="#5F5E5A">Manifest, verified listing</text><line x1="170.0" y1="180" x2="170.0" y2="201" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><rect x="40" y="204" width="260" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/><text x="170.0" y="227" text-anchor="middle" font-size="14" font-weight="600" fill="#412402">Delete the renders?</text><text x="170.0" y="247" text-anchor="middle" font-size="12" fill="#854F0B">Only on a clear yes</text><line x1="170.0" y1="262" x2="170.0" y2="283" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><rect x="40" y="286" width="260" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="170.0" y="309" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">Toolkit review: gather</text><text x="170.0" y="329" text-anchor="middle" font-size="12" fill="#5F5E5A">Repeats, workarounds, drift</text><line x1="170.0" y1="344" x2="170.0" y2="365" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><rect x="40" y="368" width="260" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/><text x="170.0" y="391" text-anchor="middle" font-size="14" font-weight="600" fill="#412402">You pick candidates</text><text x="170.0" y="411" text-anchor="middle" font-size="12" fill="#854F0B">Row by row, or skip it</text><line x1="170.0" y1="426" x2="170.0" y2="447" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><rect x="40" y="450" width="260" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="170.0" y="473" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">Add to lp-toolkit</text><text x="170.0" y="493" text-anchor="middle" font-size="12" fill="#5F5E5A">Linked checkout, stills check</text><rect x="360" y="450" width="280" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/><text x="500.0" y="473" text-anchor="middle" font-size="14" font-weight="600" fill="#042C53">lp-toolkit repo</text><text x="500.0" y="493" text-anchor="middle" font-size="12" fill="#185FA5">One version bump and tag</text><path d="M302 478 L357 478" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><line x1="170.0" y1="508" x2="170.0" y2="529" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><rect x="40" y="532" width="260" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/><text x="170.0" y="555" text-anchor="middle" font-size="14" font-weight="600" fill="#412402">You approve the push</text><text x="170.0" y="575" text-anchor="middle" font-size="12" fill="#854F0B">Then the path moves to the tag</text><rect x="40" y="622" width="14" height="14" rx="3" fill="#F1EFE8" stroke="#5F5E5A"/><text x="62" y="634" font-size="12" fill="#444441">main chat</text><rect x="150" y="622" width="14" height="14" rx="3" fill="#FAEEDA" stroke="#854F0B"/><text x="172" y="634" font-size="12" fill="#444441">your stop</text><rect x="260" y="622" width="14" height="14" rx="3" fill="#E6F1FB" stroke="#185FA5"/><text x="282" y="634" font-size="12" fill="#444441">outside repo</text><text x="40" y="662" font-size="12" fill="#5F5E5A">/toolkit-review runs the last four steps on its own, any time, from a path folder.</text><text x="40" y="682" font-size="12" fill="#5F5E5A">In /closeout it runs on a whole-path closeout only, and never changes the delivered path.</text></g></svg>