<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1348" viewBox="0 0 680 674" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="680" height="674" fill="#FFFFFF"/><text x="40" y="34" font-size="18" font-weight="600" fill="#2C2C2A">/scripts: narration and visual briefs</text><text x="40" y="54" font-size="12" fill="#5F5E5A">Every word the narrator says, written before any narration credits are spent.</text><g transform="translate(0 40)"><rect x="40" y="40" width="260" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="170.0" y="63" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">Read the outline</text><text x="170.0" y="83" text-anchor="middle" font-size="12" fill="#5F5E5A">Asks if it is still a draft</text><line x1="170.0" y1="98" x2="170.0" y2="119" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><rect x="40" y="122" width="260" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="170.0" y="145" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">Research briefs</text><text x="170.0" y="165" text-anchor="middle" font-size="12" fill="#5F5E5A">For each module or lab in range</text><rect x="360" y="122" width="280" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="500.0" y="145" text-anchor="middle" font-size="14" font-weight="600" fill="#26215C">researcher</text><text x="500.0" y="165" text-anchor="middle" font-size="12" fill="#534AB7">One per module or lab, in parallel</text><path d="M302 150 L357 150" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><line x1="170.0" y1="180" x2="170.0" y2="201" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><rect x="40" y="204" width="260" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="170.0" y="227" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">Write the scripts</text><text x="170.0" y="247" text-anchor="middle" font-size="12" fill="#5F5E5A">Narration, visual brief, unslop</text><line x1="170.0" y1="262" x2="170.0" y2="316.0" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><rect x="40" y="319.0" width="260" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="170.0" y="342.0" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">Check and fix</text><text x="170.0" y="362.0" text-anchor="middle" font-size="12" fill="#5F5E5A">Blocking and fix findings</text><rect x="360" y="286" width="280" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="500.0" y="309" text-anchor="middle" font-size="14" font-weight="600" fill="#04342C">script-linter</text><text x="500.0" y="329" text-anchor="middle" font-size="12" fill="#0F6E56">Always: the pre-audio check</text><path d="M302 347.0 L330 347.0 L330 314 L357 314" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><rect x="360" y="352" width="280" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1" stroke-dasharray="5 4"/><text x="500.0" y="375" text-anchor="middle" font-size="14" font-weight="600" fill="#04342C">prose-checker</text><text x="500.0" y="395" text-anchor="middle" font-size="12" fill="#0F6E56">Batches, or when you ask</text><path d="M302 347.0 L330 347.0 L330 380 L357 380" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)" stroke-dasharray="4 3"/><line x1="170.0" y1="377.0" x2="170.0" y2="431" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><rect x="40" y="434" width="260" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/><text x="170.0" y="457" text-anchor="middle" font-size="14" font-weight="600" fill="#412402">You review the scripts</text><text x="170.0" y="477" text-anchor="middle" font-size="12" fill="#854F0B">Edit freely before /audio</text><rect x="40" y="524" width="14" height="14" rx="3" fill="#F1EFE8" stroke="#5F5E5A"/><text x="62" y="536" font-size="12" fill="#444441">main chat</text><rect x="150" y="524" width="14" height="14" rx="3" fill="#FAEEDA" stroke="#854F0B"/><text x="172" y="536" font-size="12" fill="#444441">your stop</text><rect x="260" y="524" width="14" height="14" rx="3" fill="#EEEDFE" stroke="#534AB7"/><text x="282" y="536" font-size="12" fill="#444441">agent, writes files</text><rect x="430" y="524" width="14" height="14" rx="3" fill="#E1F5EE" stroke="#0F6E56"/><text x="452" y="536" font-size="12" fill="#444441">reviewer, read-only</text><text x="40" y="564" font-size="12" fill="#5F5E5A">Traditional: each video gets 00-intro.md (chapter 0) and one file per chapter.</text><text x="40" y="584" font-size="12" fill="#5F5E5A">Lab-first: one spec per media ID: narration for videos, a loop spec per GIF, a layout per card.</text><text x="40" y="604" font-size="12" fill="#5F5E5A">Dashed: only when needed (the main chat decides, or the condition in the box holds).</text></g></svg>