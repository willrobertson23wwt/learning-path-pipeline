<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="2260" viewBox="0 0 680 1130" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="680" height="1130" fill="#FFFFFF"/><text x="40" y="34" font-size="18" font-weight="600" fill="#2C2C2A">/video, lab-first: one lab’s media</text><text x="40" y="54" font-size="12" fill="#5F5E5A">The briefing, micro-videos, GIFs and cards a lab embeds. The main chat orchestrates.</text><g transform="translate(0 40)"><rect x="40" y="40" width="260" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="170.0" y="63" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">Inputs and continuity</text><text x="170.0" y="83" text-anchor="middle" font-size="12" fill="#5F5E5A">Specs, transcripts, a lab note</text><rect x="360" y="40" width="280" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1" stroke-dasharray="5 4"/><text x="500.0" y="63" text-anchor="middle" font-size="14" font-weight="600" fill="#26215C">article-writer</text><text x="500.0" y="83" text-anchor="middle" font-size="12" fill="#534AB7">Standalone videos only, background</text><path d="M302 68 L357 68" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)" stroke-dasharray="4 3"/><line x1="170.0" y1="98" x2="170.0" y2="119" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><rect x="40" y="122" width="260" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="170.0" y="145" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">GIFs and cards</text><text x="170.0" y="165" text-anchor="middle" font-size="12" fill="#5F5E5A">Built from their specs</text><rect x="360" y="122" width="280" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1" stroke-dasharray="5 4"/><text x="500.0" y="145" text-anchor="middle" font-size="14" font-weight="600" fill="#26215C">media-builder</text><text x="500.0" y="165" text-anchor="middle" font-size="12" fill="#534AB7">Three or more: one each, parallel</text><path d="M302 150 L357 150" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)" stroke-dasharray="4 3"/><line x1="170.0" y1="180" x2="170.0" y2="201" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><rect x="40" y="204" width="260" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="170.0" y="227" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">Shot lists, narrated items</text><text x="170.0" y="247" text-anchor="middle" font-size="12" fill="#5F5E5A">Design first, then toolkit check</text><rect x="360" y="204" width="280" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1" stroke-dasharray="5 4"/><text x="500.0" y="227" text-anchor="middle" font-size="14" font-weight="600" fill="#26215C">video-designer</text><text x="500.0" y="247" text-anchor="middle" font-size="12" fill="#534AB7">Only for a fresh design</text><path d="M302 232 L357 232" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)" stroke-dasharray="4 3"/><line x1="170.0" y1="262" x2="170.0" y2="283" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><rect x="40" y="286" width="260" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/><text x="170.0" y="309" text-anchor="middle" font-size="14" font-weight="600" fill="#412402">You approve the shot lists</text><text x="170.0" y="329" text-anchor="middle" font-size="12" fill="#854F0B">Assets, Blender, narration changes</text><line x1="170.0" y1="344" x2="170.0" y2="431.0" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><rect x="40" y="434.0" width="260" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="170.0" y="457.0" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">Build narrated items</text><text x="170.0" y="477.0" text-anchor="middle" font-size="12" fill="#5F5E5A">You, or builders in parallel</text><rect x="360" y="368" width="280" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1" stroke-dasharray="5 4"/><text x="500.0" y="391" text-anchor="middle" font-size="14" font-weight="600" fill="#26215C">sketch-builder</text><text x="500.0" y="411" text-anchor="middle" font-size="12" fill="#534AB7">Two or more: one per item</text><path d="M302 462.0 L330 462.0 L330 396 L357 396" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)" stroke-dasharray="4 3"/><rect x="360" y="434" width="280" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="500.0" y="457" text-anchor="middle" font-size="14" font-weight="600" fill="#26215C">sound-engineer</text><text x="500.0" y="477" text-anchor="middle" font-size="12" fill="#534AB7">Plan mode, alongside the build</text><path d="M302 462.0 L330 462.0 L330 462 L357 462" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><rect x="360" y="500" width="280" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1" stroke-dasharray="5 4"/><text x="500.0" y="523" text-anchor="middle" font-size="14" font-weight="600" fill="#26215C">manim / blender-builder</text><text x="500.0" y="543" text-anchor="middle" font-size="12" fill="#534AB7">Exact plots or real 3D devices</text><path d="M302 462.0 L330 462.0 L330 528 L357 528" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)" stroke-dasharray="4 3"/><line x1="170.0" y1="492.0" x2="170.0" y2="579" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><rect x="40" y="582" width="260" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="170.0" y="605" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">Stills review gate</text><text x="170.0" y="625" text-anchor="middle" font-size="12" fill="#5F5E5A">Whoever didn’t build it checks</text><rect x="360" y="582" width="280" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1" stroke-dasharray="5 4"/><text x="500.0" y="605" text-anchor="middle" font-size="14" font-weight="600" fill="#04342C">stills-reviewer</text><text x="500.0" y="625" text-anchor="middle" font-size="12" fill="#0F6E56">For items you built</text><path d="M302 610 L357 610" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)" stroke-dasharray="4 3"/><line x1="170.0" y1="640" x2="170.0" y2="661" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><rect x="40" y="664" width="260" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/><text x="170.0" y="687" text-anchor="middle" font-size="14" font-weight="600" fill="#412402">You pick the music</text><text x="170.0" y="707" text-anchor="middle" font-size="12" fill="#854F0B">Nothing downloads before this</text><rect x="360" y="664" width="280" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="500.0" y="687" text-anchor="middle" font-size="14" font-weight="600" fill="#26215C">sound-engineer</text><text x="500.0" y="707" text-anchor="middle" font-size="12" fill="#534AB7">Build mode: mix, mastered voice</text><path d="M302 692 L357 692" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><line x1="170.0" y1="722" x2="170.0" y2="743" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><rect x="40" y="746" width="260" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/><text x="170.0" y="769" text-anchor="middle" font-size="14" font-weight="600" fill="#412402">Studio handoff</text><text x="170.0" y="789" text-anchor="middle" font-size="12" fill="#854F0B">Your tweaks; /revise for notes</text><line x1="170.0" y1="804" x2="170.0" y2="825" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><rect x="40" y="828" width="260" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="170.0" y="851" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">Render each item</text><text x="170.0" y="871" text-anchor="middle" font-size="12" fill="#5F5E5A">Video, muted GIF loop, card still</text><line x1="170.0" y1="886" x2="170.0" y2="907" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><rect x="40" y="910" width="260" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="170.0" y="933" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">Deliver and record</text><text x="170.0" y="953" text-anchor="middle" font-size="12" fill="#5F5E5A">deliverables/, the lab repo, status</text><rect x="40" y="1000" width="14" height="14" rx="3" fill="#F1EFE8" stroke="#5F5E5A"/><text x="62" y="1012" font-size="12" fill="#444441">main chat</text><rect x="150" y="1000" width="14" height="14" rx="3" fill="#FAEEDA" stroke="#854F0B"/><text x="172" y="1012" font-size="12" fill="#444441">your stop</text><rect x="260" y="1000" width="14" height="14" rx="3" fill="#EEEDFE" stroke="#534AB7"/><text x="282" y="1012" font-size="12" fill="#444441">agent, writes files</text><rect x="430" y="1000" width="14" height="14" rx="3" fill="#E1F5EE" stroke="#0F6E56"/><text x="452" y="1012" font-size="12" fill="#444441">reviewer, read-only</text><text x="40" y="1040" font-size="12" fill="#5F5E5A">Media IDs: &lt;prefix&gt;-briefing, &lt;prefix&gt;-lN-vM (micro-video), &lt;prefix&gt;-lN-gM (GIF), &lt;prefix&gt;-card-&lt;name&gt;.</text><text x="40" y="1060" font-size="12" fill="#5F5E5A">Dashed: only when needed (the main chat decides, or the condition in the box holds).</text></g></svg>