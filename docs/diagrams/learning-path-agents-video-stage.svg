<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1780" viewBox="0 0 680 890" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="680" height="890" fill="#FFFFFF"/><text x="40" y="34" font-size="18" font-weight="600" fill="#2C2C2A">The /video stage: hand-drawn narrated video flow</text><text x="40" y="54" font-size="12" fill="#5F5E5A">Builders check feasibility with the designer first. Dashed: only for exact pieces.</text><g transform="translate(0 40)"><rect x="200" y="40" width="280" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="340.0" y="63" text-anchor="middle" font-size="14" font-weight="600" fill="#26215C">video-designer</text><text x="340.0" y="83" text-anchor="middle" font-size="12" fill="#534AB7">shot list, revises on feedback</text><line x1="340" y1="98" x2="340" y2="117" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><rect x="200" y="120" width="280" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="340.0" y="143" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">You approve the shot list</text><text x="340.0" y="163" text-anchor="middle" font-size="12" fill="#5F5E5A">review stop</text><path d="M340 178 L340 190 L130 190 L130 205" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)" stroke-dasharray="4 3"/><line x1="340" y1="178" x2="340" y2="205" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><path d="M340 190 L550 190 L550 205" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)" stroke-dasharray="4 3"/><rect x="40" y="208" width="180" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1" stroke-dasharray="5 4"/><text x="130.0" y="231" text-anchor="middle" font-size="14" font-weight="600" fill="#26215C">manim-builder</text><text x="130.0" y="251" text-anchor="middle" font-size="12" fill="#534AB7">exact plots, on demand</text><rect x="250" y="208" width="180" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="340.0" y="231" text-anchor="middle" font-size="14" font-weight="600" fill="#26215C">sketch-builder</text><text x="340.0" y="251" text-anchor="middle" font-size="12" fill="#534AB7">draws it, builds the video</text><rect x="460" y="208" width="180" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1" stroke-dasharray="5 4"/><text x="550.0" y="231" text-anchor="middle" font-size="14" font-weight="600" fill="#26215C">blender-builder</text><text x="550.0" y="251" text-anchor="middle" font-size="12" fill="#534AB7">real 3D devices, on demand</text><path d="M222 236 L247 236" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)" stroke-dasharray="4 3"/><path d="M458 236 L433 236" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)" stroke-dasharray="4 3"/><line x1="340" y1="266" x2="340" y2="297" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><rect x="200" y="300" width="280" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="340.0" y="323" text-anchor="middle" font-size="14" font-weight="600" fill="#26215C">sound-engineer</text><text x="340.0" y="343" text-anchor="middle" font-size="12" fill="#534AB7">music, effects, voice master</text><line x1="340" y1="358" x2="340" y2="377" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><rect x="200" y="380" width="280" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="340.0" y="403" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">You pick music and effects</text><text x="340.0" y="423" text-anchor="middle" font-size="12" fill="#5F5E5A">approve downloads</text><line x1="340" y1="438" x2="340" y2="457" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><rect x="200" y="460" width="280" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="340.0" y="483" text-anchor="middle" font-size="14" font-weight="600" fill="#04342C">stills-reviewer</text><text x="340.0" y="503" text-anchor="middle" font-size="12" fill="#0F6E56">findings go back to builders</text><line x1="340" y1="518" x2="340" y2="537" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><rect x="200" y="540" width="280" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="340.0" y="563" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">You tweak in Studio</text><text x="340.0" y="583" text-anchor="middle" font-size="12" fill="#5F5E5A">positions, toggles</text><line x1="340" y1="598" x2="340" y2="617" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><rect x="200" y="620" width="280" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="340.0" y="643" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">Final render</text><text x="340.0" y="663" text-anchor="middle" font-size="12" fill="#5F5E5A">main thread, loudness check</text><line x1="40" y1="700" x2="640" y2="700" stroke="#B4B2A9" stroke-width="0.75" stroke-dasharray="4 4"/><text x="40" y="692" font-size="12" fill="#5F5E5A">Also in /video:</text><rect x="40" y="716" width="150" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="115.0" y="739" text-anchor="middle" font-size="14" font-weight="600" fill="#26215C">media-builder</text><text x="115.0" y="759" text-anchor="middle" font-size="12" fill="#534AB7">GIFs, cards (lab-first)</text><rect x="212" y="716" width="140" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="282.0" y="739" text-anchor="middle" font-size="14" font-weight="600" fill="#04342C">stills-reviewer</text><text x="282.0" y="759" text-anchor="middle" font-size="12" fill="#0F6E56">checks stills</text><line x1="192" y1="744" x2="209" y2="744" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><rect x="378" y="716" width="130" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="443.0" y="739" text-anchor="middle" font-size="14" font-weight="600" fill="#26215C">article-writer</text><text x="443.0" y="759" text-anchor="middle" font-size="12" fill="#534AB7">a video&#8217;s article</text><rect x="530" y="716" width="130" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="595.0" y="739" text-anchor="middle" font-size="14" font-weight="600" fill="#04342C">prose-checker</text><text x="595.0" y="759" text-anchor="middle" font-size="12" fill="#0F6E56">rereads article</text><line x1="510" y1="744" x2="527" y2="744" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><rect x="40" y="792" width="14" height="14" rx="3" fill="#F1EFE8" stroke="#5F5E5A"/><text x="62" y="804" font-size="12" fill="#444441">you or the main thread</text><rect x="230" y="792" width="14" height="14" rx="3" fill="#EEEDFE" stroke="#534AB7"/><text x="252" y="804" font-size="12" fill="#444441">writes files</text><rect x="370" y="792" width="14" height="14" rx="3" fill="#E1F5EE" stroke="#0F6E56"/><text x="392" y="804" font-size="12" fill="#444441">read-only reviewer</text><text x="40" y="838" font-size="12" fill="#5F5E5A">Traditional: all of a video&#8217;s chapters in one pass. Lab-first: each video, plus GIFs and cards.</text></g></svg>