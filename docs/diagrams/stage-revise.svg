<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1472" viewBox="0 0 680 736" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="680" height="736" fill="#FFFFFF"/><text x="40" y="34" font-size="18" font-weight="600" fill="#2C2C2A">/revise: act on your review notes</text><text x="40" y="54" font-size="12" fill="#5F5E5A">Notes come from the review editor: a mark on a frame, or a time range, with a comment.</text><g transform="translate(0 40)"><rect x="40" y="40" width="260" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/><text x="170.0" y="63" text-anchor="middle" font-size="14" font-weight="600" fill="#412402">You mark frames</text><text x="170.0" y="83" text-anchor="middle" font-size="12" fill="#854F0B">In the review editor, then Send</text><line x1="170.0" y1="98" x2="170.0" y2="119" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><rect x="40" y="122" width="260" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="170.0" y="145" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">Load the notes</text><text x="170.0" y="165" text-anchor="middle" font-size="12" fill="#5F5E5A">Submitted or reopened ones</text><line x1="170.0" y1="180" x2="170.0" y2="201" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><rect x="40" y="204" width="260" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="170.0" y="227" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">Find each element</text><text x="170.0" y="247" text-anchor="middle" font-size="12" fill="#5F5E5A">Beats, bounding box, shot list</text><line x1="170.0" y1="262" x2="170.0" y2="316.0" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><rect x="40" y="319.0" width="260" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="170.0" y="342.0" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">Fix each note</text><text x="170.0" y="362.0" text-anchor="middle" font-size="12" fill="#5F5E5A">Redraw, retime, reposition</text><rect x="360" y="286" width="280" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1" stroke-dasharray="5 4"/><text x="500.0" y="309" text-anchor="middle" font-size="14" font-weight="600" fill="#26215C">sound-engineer</text><text x="500.0" y="329" text-anchor="middle" font-size="12" fill="#534AB7">Music or effect notes</text><path d="M302 347.0 L330 347.0 L330 314 L357 314" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)" stroke-dasharray="4 3"/><rect x="360" y="352" width="280" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1" stroke-dasharray="5 4"/><text x="500.0" y="375" text-anchor="middle" font-size="14" font-weight="600" fill="#26215C">manim / blender-builder</text><text x="500.0" y="395" text-anchor="middle" font-size="12" fill="#534AB7">Exact layers</text><path d="M302 347.0 L330 347.0 L330 380 L357 380" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)" stroke-dasharray="4 3"/><line x1="170.0" y1="377.0" x2="170.0" y2="431" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><rect x="40" y="434" width="260" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="170.0" y="457" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">After-stills</text><text x="170.0" y="477" text-anchor="middle" font-size="12" fill="#5F5E5A">Typecheck, compare the frames</text><rect x="360" y="434" width="280" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1" stroke-dasharray="5 4"/><text x="500.0" y="457" text-anchor="middle" font-size="14" font-weight="600" fill="#04342C">stills-reviewer</text><text x="500.0" y="477" text-anchor="middle" font-size="12" fill="#0F6E56">If more than a tweak changed</text><path d="M302 462 L357 462" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)" stroke-dasharray="4 3"/><line x1="170.0" y1="492" x2="170.0" y2="513" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><rect x="40" y="516" width="260" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/><text x="170.0" y="539" text-anchor="middle" font-size="14" font-weight="600" fill="#412402">You verify or reopen</text><text x="170.0" y="559" text-anchor="middle" font-size="12" fill="#854F0B">In the editor</text><rect x="40" y="606" width="14" height="14" rx="3" fill="#F1EFE8" stroke="#5F5E5A"/><text x="62" y="618" font-size="12" fill="#444441">main chat</text><rect x="150" y="606" width="14" height="14" rx="3" fill="#FAEEDA" stroke="#854F0B"/><text x="172" y="618" font-size="12" fill="#444441">your stop</text><rect x="260" y="606" width="14" height="14" rx="3" fill="#EEEDFE" stroke="#534AB7"/><text x="282" y="618" font-size="12" fill="#444441">agent, writes files</text><rect x="430" y="606" width="14" height="14" rx="3" fill="#E1F5EE" stroke="#0F6E56"/><text x="452" y="618" font-size="12" fill="#444441">reviewer, read-only</text><text x="40" y="646" font-size="12" fill="#5F5E5A">A change to the narration wording is out of scope: it goes back through /audio.</text><text x="40" y="666" font-size="12" fill="#5F5E5A">Dashed: only when needed (the main chat decides, or the condition in the box holds).</text></g></svg>