<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1340" viewBox="0 0 680 670" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="680" height="670" fill="#FFFFFF"/><text x="40" y="34" font-size="18" font-weight="600" fill="#2C2C2A">/outline: plan the path</text><text x="40" y="54" font-size="12" fill="#5F5E5A">An interactive plan, built with you step by step from a research survey.</text><g transform="translate(0 40)"><rect x="40" y="40" width="260" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="170.0" y="63" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">Scope, start research</text><text x="170.0" y="83" text-anchor="middle" font-size="12" fill="#5F5E5A">Picks the slug first</text><rect x="360" y="40" width="280" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="500.0" y="63" text-anchor="middle" font-size="14" font-weight="600" fill="#26215C">researcher</text><text x="500.0" y="83" text-anchor="middle" font-size="12" fill="#534AB7">Outline mode, in the background</text><path d="M302 68 L357 68" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><line x1="170.0" y1="98" x2="170.0" y2="119" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><rect x="40" y="122" width="260" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/><text x="170.0" y="145" text-anchor="middle" font-size="14" font-weight="600" fill="#412402">Scoping questions</text><text x="170.0" y="165" text-anchor="middle" font-size="12" fill="#854F0B">Audience, outcome, environment</text><line x1="170.0" y1="180" x2="170.0" y2="201" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><rect x="40" y="204" width="260" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/><text x="170.0" y="227" text-anchor="middle" font-size="14" font-weight="600" fill="#412402">Research findings</text><text x="170.0" y="247" text-anchor="middle" font-size="12" fill="#854F0B">You pick the shape and topics</text><line x1="170.0" y1="262" x2="170.0" y2="283" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><rect x="40" y="286" width="260" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/><text x="170.0" y="309" text-anchor="middle" font-size="14" font-weight="600" fill="#412402">The skeleton</text><text x="170.0" y="329" text-anchor="middle" font-size="12" fill="#854F0B">Revised until you approve it</text><line x1="170.0" y1="344" x2="170.0" y2="365" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><rect x="40" y="368" width="260" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="170.0" y="391" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">Full draft</text><text x="170.0" y="411" text-anchor="middle" font-size="12" fill="#5F5E5A">Design rules, unslop, saved as draft</text><rect x="360" y="368" width="280" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="500.0" y="391" text-anchor="middle" font-size="14" font-weight="600" fill="#04342C">prose-checker</text><text x="500.0" y="411" text-anchor="middle" font-size="12" fill="#0F6E56">Rereads the saved outline</text><path d="M302 396 L357 396" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><line x1="170.0" y1="426" x2="170.0" y2="447" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><rect x="40" y="450" width="260" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/><text x="170.0" y="473" text-anchor="middle" font-size="14" font-weight="600" fill="#412402">You approve the outline</text><text x="170.0" y="493" text-anchor="middle" font-size="12" fill="#854F0B">You set status: approved</text><rect x="40" y="540" width="14" height="14" rx="3" fill="#F1EFE8" stroke="#5F5E5A"/><text x="62" y="552" font-size="12" fill="#444441">main chat</text><rect x="150" y="540" width="14" height="14" rx="3" fill="#FAEEDA" stroke="#854F0B"/><text x="172" y="552" font-size="12" fill="#444441">your stop</text><rect x="260" y="540" width="14" height="14" rx="3" fill="#EEEDFE" stroke="#534AB7"/><text x="282" y="552" font-size="12" fill="#444441">agent, writes files</text><rect x="430" y="540" width="14" height="14" rx="3" fill="#E1F5EE" stroke="#0F6E56"/><text x="452" y="552" font-size="12" fill="#444441">reviewer, read-only</text><text x="40" y="580" font-size="12" fill="#5F5E5A">Traditional: modules, globally numbered videos of 2-4 chapters, a closing lab per module.</text><text x="40" y="600" font-size="12" fill="#5F5E5A">Lab-first: a Module 0 briefing, labs with guidance levels, GIFs and cards, a capstone.</text></g></svg>