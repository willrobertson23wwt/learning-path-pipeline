<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1360" viewBox="0 0 680 680" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="680" height="680" fill="#FFFFFF"/><text x="40" y="34" font-size="18" font-weight="600" fill="#2C2C2A">Learning path pipeline: skills and their agents</text><text x="40" y="54" font-size="12" fill="#5F5E5A">One template, two formats. Stages run top to bottom; each row runs its agents left to right.</text><g transform="translate(0 40)"><rect x="40" y="40" width="130" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="105.0" y="63" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">/new-path</text><text x="105.0" y="83" text-anchor="middle" font-size="12" fill="#5F5E5A">asks the format</text><line x1="172" y1="68" x2="197" y2="68" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><rect x="200" y="40" width="210" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="5 4"/><text x="305.0" y="63" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">traditional</text><text x="305.0" y="83" text-anchor="middle" font-size="12" fill="#5F5E5A">videos, articles, a lab each module</text><rect x="430" y="40" width="210" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="5 4"/><text x="535.0" y="63" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">lab-first</text><text x="535.0" y="83" text-anchor="middle" font-size="12" fill="#5F5E5A">labs with media at their steps</text><text x="420" y="73" text-anchor="middle" font-size="12" fill="#5F5E5A">or</text><line x1="105" y1="98" x2="105" y2="113" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><rect x="40" y="116" width="130" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="105.0" y="139" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">/outline</text><text x="105.0" y="159" text-anchor="middle" font-size="12" fill="#5F5E5A">path plan</text><line x1="172" y1="144" x2="197" y2="144" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><rect x="200" y="116" width="130" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="265.0" y="139" text-anchor="middle" font-size="14" font-weight="600" fill="#26215C">researcher</text><text x="265.0" y="159" text-anchor="middle" font-size="12" fill="#534AB7">outline mode</text><rect x="360" y="116" width="130" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="425.0" y="139" text-anchor="middle" font-size="14" font-weight="600" fill="#04342C">prose-checker</text><text x="425.0" y="159" text-anchor="middle" font-size="12" fill="#0F6E56">rereads prose</text><line x1="332" y1="144" x2="357" y2="144" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><line x1="105" y1="174" x2="105" y2="189" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><rect x="40" y="192" width="130" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="105.0" y="215" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">/scripts</text><text x="105.0" y="235" text-anchor="middle" font-size="12" fill="#5F5E5A">narration scripts</text><line x1="172" y1="220" x2="197" y2="220" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><rect x="200" y="192" width="130" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="265.0" y="215" text-anchor="middle" font-size="14" font-weight="600" fill="#26215C">researcher</text><text x="265.0" y="235" text-anchor="middle" font-size="12" fill="#534AB7">module or lab brief</text><rect x="360" y="192" width="130" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="425.0" y="215" text-anchor="middle" font-size="14" font-weight="600" fill="#04342C">script-linter</text><text x="425.0" y="235" text-anchor="middle" font-size="12" fill="#0F6E56">pre-audio QA</text><line x1="332" y1="220" x2="357" y2="220" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><rect x="510" y="192" width="130" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="575.0" y="215" text-anchor="middle" font-size="14" font-weight="600" fill="#04342C">prose-checker</text><text x="575.0" y="235" text-anchor="middle" font-size="12" fill="#0F6E56">rereads prose</text><line x1="492" y1="220" x2="507" y2="220" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><line x1="105" y1="250" x2="105" y2="265" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><rect x="40" y="268" width="130" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="105.0" y="291" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">/audio</text><text x="105.0" y="311" text-anchor="middle" font-size="12" fill="#5F5E5A">narration</text><line x1="172" y1="296" x2="197" y2="296" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><rect x="200" y="268" width="130" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="265.0" y="291" text-anchor="middle" font-size="14" font-weight="600" fill="#04342C">script-linter</text><text x="265.0" y="311" text-anchor="middle" font-size="12" fill="#0F6E56">gate before voice</text><line x1="105" y1="326" x2="105" y2="341" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><rect x="40" y="344" width="130" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="105.0" y="367" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">/video</text><text x="105.0" y="387" text-anchor="middle" font-size="12" fill="#5F5E5A">videos and media</text><line x1="172" y1="372" x2="197" y2="372" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><rect x="200" y="344" width="440" height="56" rx="8" fill="none" stroke="#888780" stroke-width="1" stroke-dasharray="5 4"/><text x="420" y="367" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">8 agents, shot list to final mix</text><text x="420" y="387" text-anchor="middle" font-size="12" fill="#5F5E5A">detail in the video stage diagram</text><line x1="105" y1="402" x2="105" y2="417" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><rect x="40" y="420" width="130" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="105.0" y="443" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">/lab</text><text x="105.0" y="463" text-anchor="middle" font-size="12" fill="#5F5E5A">lab guide</text><line x1="172" y1="448" x2="197" y2="448" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><rect x="200" y="420" width="130" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="265.0" y="443" text-anchor="middle" font-size="14" font-weight="600" fill="#26215C">researcher</text><text x="265.0" y="463" text-anchor="middle" font-size="12" fill="#534AB7">reuses the brief</text><rect x="360" y="420" width="130" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="425.0" y="443" text-anchor="middle" font-size="14" font-weight="600" fill="#04342C">prose-checker</text><text x="425.0" y="463" text-anchor="middle" font-size="12" fill="#0F6E56">rereads prose</text><line x1="332" y1="448" x2="357" y2="448" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><line x1="105" y1="478" x2="105" y2="493" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><rect x="40" y="496" width="130" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="105.0" y="519" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">/lab-review</text><text x="105.0" y="539" text-anchor="middle" font-size="12" fill="#5F5E5A">fresh-eyes check</text><line x1="172" y1="524" x2="197" y2="524" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><rect x="200" y="496" width="130" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="265.0" y="519" text-anchor="middle" font-size="14" font-weight="600" fill="#26215C">lab-walker</text><text x="265.0" y="539" text-anchor="middle" font-size="12" fill="#534AB7">review and fixes</text><rect x="360" y="496" width="130" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="425.0" y="519" text-anchor="middle" font-size="14" font-weight="600" fill="#04342C">lab-learner</text><text x="425.0" y="539" text-anchor="middle" font-size="12" fill="#0F6E56">literal learner</text><line x1="332" y1="524" x2="357" y2="524" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><rect x="510" y="496" width="130" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="575.0" y="519" text-anchor="middle" font-size="14" font-weight="600" fill="#04342C">prose-checker</text><text x="575.0" y="539" text-anchor="middle" font-size="12" fill="#0F6E56">runs alongside</text><rect x="40" y="582" width="14" height="14" rx="3" fill="#F1EFE8" stroke="#5F5E5A"/><text x="62" y="594" font-size="12" fill="#444441">skill (you review after each)</text><rect x="250" y="582" width="14" height="14" rx="3" fill="#EEEDFE" stroke="#534AB7"/><text x="272" y="594" font-size="12" fill="#444441">agent that writes files</text><rect x="430" y="582" width="14" height="14" rx="3" fill="#E1F5EE" stroke="#0F6E56"/><text x="452" y="594" font-size="12" fill="#444441">read-only reviewer</text><text x="40" y="626" font-size="12" fill="#5F5E5A">Both formats run the same stages and agents; the format decides what each skill writes.</text></g></svg>