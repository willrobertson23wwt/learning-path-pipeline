<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 200" width="700" height="200"
     font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <!-- Single-VM lab topology starter. Rename the host, fix the role line, re-center if you
       change widths (rows must share the canvas midpoint), then render-verify per SKILL.md. -->
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#dbe4f0" stroke-width="0.7"/>
    </pattern>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#1e293b" flood-opacity="0.16"/>
    </filter>
    <marker id="ah-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 z" fill="#2563eb"/>
    </marker>
    <marker id="ah-gray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Background: blueprint grid -->
  <rect width="700" height="200" rx="10" fill="#f5f8fc"/>
  <rect x="1" y="1" width="698" height="198" rx="10" fill="url(#grid)" stroke="#c7d2e0" stroke-width="1"/>

  <!-- YOU (laptop) -->
  <rect x="55" y="42" width="130" height="115" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="87" y="56" width="66" height="44" rx="3" fill="#1f2937"/>
  <rect x="91" y="60" width="58" height="36" fill="#f8fafc"/>
  <rect x="91" y="60" width="58" height="7" fill="#e2e8f0"/>
  <circle cx="95" cy="63.5" r="1.3" fill="#ef4444"/><circle cx="99" cy="63.5" r="1.3" fill="#f59e0b"/><circle cx="103" cy="63.5" r="1.3" fill="#22c55e"/>
  <rect x="108" y="61.5" width="38" height="4" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.6"/>
  <rect x="95" y="72" width="34" height="3" rx="1.5" fill="#94a3b8"/>
  <rect x="95" y="79" width="50" height="3" rx="1.5" fill="#cbd5e1"/>
  <rect x="95" y="85" width="44" height="3" rx="1.5" fill="#cbd5e1"/>
  <rect x="95" y="91" width="30" height="3" rx="1.5" fill="#cbd5e1"/>
  <rect x="79" y="101" width="82" height="6" rx="2" fill="#94a3b8"/>
  <text x="120" y="130" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">YOU</text>
  <text x="120" y="146" text-anchor="middle" font-size="10" fill="#334155">web browser</text>

  <!-- HTTPS -->
  <line x1="191" y1="99" x2="267" y2="99" stroke="#2563eb" stroke-width="1.6"
        marker-start="url(#ah-blue)" marker-end="url(#ah-blue)"/>
  <text x="229" y="92" text-anchor="middle" font-size="9" font-weight="600" fill="#2563eb">HTTPS</text>

  <!-- Internet / ATC portal cloud (stroked pass, then fill-only pass to hide interior strokes) -->
  <g stroke="#94a3b8" stroke-width="3" fill="#ffffff">
    <circle cx="300" cy="102" r="28"/><circle cx="335" cy="84" r="34"/><circle cx="373" cy="100" r="28"/>
    <rect x="290" y="97" width="110" height="32" rx="16"/>
  </g>
  <g fill="#ffffff">
    <circle cx="300" cy="102" r="28"/><circle cx="335" cy="84" r="34"/><circle cx="373" cy="100" r="28"/>
    <rect x="290" y="97" width="110" height="32" rx="16"/>
  </g>
  <text x="335" y="98" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b">INTERNET</text>
  <text x="335" y="112" text-anchor="middle" font-size="9" fill="#64748b">WWT ATC Lab Portal</text>

  <!-- cloud ↔ VM -->
  <line x1="407" y1="99" x2="469" y2="99" stroke="#64748b" stroke-width="1.6"
        marker-start="url(#ah-gray)" marker-end="url(#ah-gray)"/>

  <!-- The lab VM (server icon; swap for the terminal-window icon if the host is the learner's workstation) -->
  <rect x="475" y="42" width="170" height="115" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="493" y="68" width="44" height="60" rx="4" fill="#e2e8f0" stroke="#64748b" stroke-width="1.3"/>
  <rect x="498" y="75" width="34" height="8" rx="1.5" fill="#cbd5e1"/>
  <rect x="498" y="88" width="34" height="8" rx="1.5" fill="#cbd5e1"/>
  <rect x="498" y="101" width="34" height="8" rx="1.5" fill="#cbd5e1"/>
  <circle cx="501" cy="120" r="1.8" fill="#22c55e"/><circle cx="507" cy="120" r="1.8" fill="#22c55e"/>
  <text x="551" y="92" font-size="16" font-weight="700" fill="#1e293b">hostname</text>
  <text x="551" y="110" font-size="10.5" fill="#334155">Ubuntu 24.04</text>
  <text x="551" y="126" font-size="10" fill="#334155">role · detail</text>
</svg>
